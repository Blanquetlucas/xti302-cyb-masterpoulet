# Bonus Lynis NETW-3200, USB-1000, STRG-1846 : protocoles et supports inutiles
# sur ce serveur. "install ... /bin/false" bloque aussi le chargement à la
# demande, qu'un simple utilisateur peut déclencher (ouvrir une socket DCCP).
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install usb_storage /bin/false
install firewire_core /bin/false
