#!/usr/sbin/nft -f
# J2 - pare-feu srv-masterpoulet
# Pas de "flush ruleset" : il effacerait aussi la table de fail2ban
# (inet f2b-table) à chaque "systemctl reload nftables". On ne recrée que
# notre propre table.

table inet filtre
delete table inet filtre

table inet filtre {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state invalid drop
        ct state established,related accept

        tcp dport 22 ct state new accept

        # ping limité, et les ICMP d'erreur utiles (MTU, injoignable)
        ip protocol icmp icmp type { echo-request } limit rate 5/second accept
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        # IPv6 ne fonctionne pas sans la découverte de voisins
        ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 5/second accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
