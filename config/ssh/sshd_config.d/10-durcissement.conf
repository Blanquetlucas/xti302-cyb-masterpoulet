# Durcissement SSH srv-masterpoulet (S1 à S4)
# sshd garde la première valeur lue : ce fichier doit passer avant les
# autres fichiers de sshd_config.d et avant la suite de sshd_config.

# S1 : clé uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# S2
PermitRootLogin no

# S3
AllowGroups acces_ssh

# S4 : 3 essais par connexion, 30 s pour s'authentifier
MaxAuthTries 3
LoginGraceTime 30
# client qui ne répond plus : coupé après 2 x 5 min
ClientAliveInterval 300
ClientAliveCountMax 2
# session ouverte mais sans aucun trafic : fermée au bout de 10 min
ChannelTimeout session=10m
UnusedConnectionTimeout 5m

# Pas de redirections, on n'en a pas besoin sur ce serveur
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no

# VERBOSE ajoute l'empreinte de la clé utilisée dans le journal
LogLevel VERBOSE

# Bonus ssh-audit : ni courbes NIST, ni SHA-1, ni MAC "encrypt-and-MAC".
# Ed25519 et RSA seulement en clés d'hôte (la clé ECDSA n'est plus proposée).
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# Bonus Lynis BANN-7130 : bannière avant authentification
Banner /etc/issue.net
