# J1 - fail2ban sur SSH
[DEFAULT]
# pas de auth.log sur Debian 13 minimal, on lit journald
backend = systemd
banaction = nftables-multiport
banaction_allports = nftables-allports
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
port = ssh
# aggressive : compte aussi les "Connection closed by authenticating user
# ... [preauth]" (clé refusée), seuls échecs visibles avec la clé seule
mode = aggressive
maxretry = 5
findtime = 10m
bantime = 15m
# même action que par défaut, mais la table f2b-table est créée dès le
# démarrage et pas au premier bannissement : on peut vérifier qu'elle
# survit à un rechargement de nftables
action = %(banaction)s[port="%(port)s", protocol="%(protocol)s", chain="%(chain)s", actionstart_on_demand=false]
